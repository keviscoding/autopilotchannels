<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy — HeadStart Channels</title>
    <meta name="description" content="Privacy Policy for HeadStart Channels. Learn how we collect, use, and protect your personal information." />
    <link rel="canonical" href="https://headstartchannels.com/#/privacy" />
    <!-- Clean URL for links. The app uses hash routing, so send
         people to the hash route while keeping any query params. -->
    <script>
      (function () {
        var qs = window.location.search || '';
        window.location.replace('/#/privacy' + qs);
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/#/privacy" />
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 24px">
      Taking you to the Privacy Policy. <a href="/#/privacy">Continue</a>.
    </p>
  </body>
</html>
